<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Résumé — Ujjwal Kumar Rai</title>
    <meta name="description" content="Résumé of Ujjwal Kumar Rai, co-founder of Aevrin." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fcfcfc;
        --fg: #18181b;
        --muted: #6b7280;
        --border: #e4e4e7;
        --bar-h: 3.5rem;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0b;
          --fg: #f4f4f5;
          --muted: #a1a1aa;
          --border: #27272a;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        height: var(--bar-h);
        padding: 0 max(1rem, env(safe-area-inset-right)) 0 max(1rem, env(safe-area-inset-left));
        border-bottom: 1px solid var(--border);
      }
      .title {
        margin: 0;
        font-size: 0.9375rem;
        font-weight: 600;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .title small {
        display: block;
        font-size: 0.75rem;
        font-weight: 400;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex: none;
        gap: 0.5rem;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        height: 2.25rem;
        padding: 0 0.9rem;
        border-radius: 9999px;
        border: 1px solid var(--border);
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--fg);
        text-decoration: none;
        white-space: nowrap;
        transition: background-color 0.15s ease;
      }
      a.btn:hover {
        background: color-mix(in oklab, var(--fg) 8%, transparent);
      }
      a.btn.primary {
        background: var(--fg);
        border-color: var(--fg);
        color: var(--bg);
      }
      a.btn.primary:hover {
        opacity: 0.85;
        background: var(--fg);
      }
      main {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      object {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .fallback {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
      }
      .fallback p {
        max-width: 24rem;
        margin: 0;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <header>
      <p class="title">
        Ujjwal Kumar Rai
        <small>Résumé</small>
      </p>
      <div class="actions">
        <a class="btn" href="./resume.pdf" target="_blank" rel="noopener">Open raw</a>
        <a class="btn primary" href="./resume.pdf" download="Ujjwal_Kumar_Rai_Resume.pdf">Download</a>
      </div>
    </header>

    <main>
      <!-- The <object> fallback content only renders when the browser can't display
           the PDF inline (e.g. some in-app browsers), so no feature-detection JS
           is needed to cover that case. -->
      <object data="./resume.pdf" type="application/pdf" aria-label="Ujjwal Kumar Rai's résumé">
        <div class="fallback">
          <p>Your browser can't display the résumé inline.</p>
          <a class="btn primary" href="./resume.pdf" download="Ujjwal_Kumar_Rai_Resume.pdf">
            Download the résumé
          </a>
        </div>
      </object>
    </main>
  </body>
</html>
