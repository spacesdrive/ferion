<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ujjwal Kumar Rai</title>
  <meta name="description" content="resume of Ujjwal Kumar Rai, co-founder of Aevrin." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="preload" href="./assets/bricolage.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face {
      font-family: 'Bricolage Grotesque';
      src: url('./assets/bricolage.woff2') format('woff2-variations');
      font-weight: 200 800;
      font-display: swap;
    }

    @font-face {
      font-family: 'Geist Mono';
      src: url('./assets/geist-mono.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }

    /* Ujjwal brand kit v2.0: ink on warm paper, no hues. */
    :root {
      color-scheme: light dark;
      --paper: #f5f4f0;
      --ink: #121212;
      --snow: #fffffc;
      --label: #5e5e5a;
      --dot: rgb(18 18 18 / 0.16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #121212;
        --ink: #f5f4f0;
        --snow: #1e1e1d;
        --label: #b5b4af;
        --dot: rgb(245 244 240 / 0.1);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.875rem max(1rem, env(safe-area-inset-right)) 0.875rem max(1rem, env(safe-area-inset-left));
      border-bottom: 2px solid var(--ink);
      background-image: radial-gradient(var(--dot) 1.3px, transparent 1.7px);
      background-size: 20px 20px;
    }

    .lockup {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 0;
      color: inherit;
      text-decoration: none;
    }

    .lockup img {
      height: 2.25rem;
      width: auto;
    }

    .mark-paper {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      .mark-ink {
        display: none;
      }

      .mark-paper {
        display: block;
      }
    }

    .wordmark {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .label {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--label);
    }

    .actions {
      display: flex;
      flex: none;
      align-items: center;
      gap: 0.75rem;
    }

    /* Ink pill: 2px border with a hard offset shadow. */
    a.pill {
      display: inline-flex;
      align-items: center;
      height: 2.25rem;
      padding: 0 1rem;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--snow);
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
      transition: translate 150ms ease, box-shadow 150ms ease;
    }

    a.pill:hover {
      translate: -2px -2px;
      box-shadow: 5px 5px 0 var(--ink);
    }

    a.pill:active {
      translate: 1px 1px;
      box-shadow: 1px 1px 0 var(--ink);
    }

    a.pill.solid {
      background: var(--ink);
      color: var(--paper);
    }

    a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      a.pill {
        transition: none;
      }

      a.pill:hover,
      a.pill:active {
        translate: none;
      }
    }

    @media (max-width: 520px) {
      .header-label {
        display: none;
      }
    }

    main {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>
  <header>
    <a class="lockup" href="https://tech.ujjwal.fyi/" aria-label="Ujjwal Kumar Rai, portfolio">
      <img class="mark-ink" src="./assets/mark-ink.webp" alt="" width="640" height="653" />
      <img class="mark-paper" src="./assets/mark-paper.webp" alt="" width="640" height="653" />
      <span class="wordmark">ujjwal</span>
    </a>
    <div class="actions">
      <span class="label header-label">Resume</span>
      <a class="pill" href="./resume.pdf" target="_blank" rel="noopener">Open raw</a>
      <a class="pill solid" href="./resume.pdf" download="Resume.pdf">Download</a>
    </div>
  </header>

  <main>
    <!-- <object type="application/pdf"> relies on a browser PDF "plugin" that most
         mobile browsers don't implement, so it silently falls back on phones even
         though the PDF is fine. An <iframe> triggers the browser's built-in PDF
         viewer instead (the same one used for a direct link), which mobile Safari
         and Chrome both support. The header's Download/Open raw buttons remain the
         fallback for the rare browser that can't render it either way. -->
    <iframe src="./resume.pdf" title="Ujjwal Kumar Rai's resume"></iframe>
  </main>
</body>

</html>
