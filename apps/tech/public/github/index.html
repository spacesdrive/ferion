<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ujjwal Kumar Rai on GitHub</title>
    <!-- A share link for LinkedIn: GitHub's own page names itself "GitHub" on link cards,
         so this page carries the card and sends people on to the profile. -->
    <meta name="robots" content="noindex" />
    <meta name="description" content="Code, tools and experiments by Ujjwal Kumar Rai on GitHub." />
    <meta name="theme-color" content="#f5f4f0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-dark.ico" sizes="any" media="(prefers-color-scheme: dark)" />

    <meta property="og:site_name" content="github.com/spacesdrive" />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://tech.ujjwal.fyi/github/" />
    <meta property="og:title" content="Ujjwal Kumar Rai on GitHub" />
    <meta property="og:description" content="Code, tools and experiments by Ujjwal Kumar Rai." />
    <meta property="og:image" content="https://tech.ujjwal.fyi/github/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Code, tools and experiments, github.com/spacesdrive" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@codewithujjwal" />

    <!-- link crawlers read the tags above and stop; people go straight to the profile -->
    <script>
      location.replace('https://github.com/spacesdrive');
    </script>
    <style>
      :root {
        --background: #f5f4f0;
        --foreground: #121212;
        --card: #fffffc;
        --muted: #5e5e5a;
        --marker: #d9d8d3;
        --line: #121212;
        --dot: rgb(18 18 18 / 0.16);
        color-scheme: light;
      }
      .dark {
        --background: #121212;
        --foreground: #f5f4f0;
        --card: #1e1e1d;
        --muted: #b5b4af;
        --marker: #3a3a38;
        --line: #f5f4f0;
        --dot: rgb(245 244 240 / 0.1);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background: var(--background) radial-gradient(var(--dot) 1.2px, transparent 1.3px) 0 0 / 28px 28px;
        color: var(--foreground);
        font-family:
          'Bricolage Grotesque',
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 30rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        padding: clamp(1.75rem, 6vw, 2.75rem);
        border: 2px solid var(--line);
        border-radius: 24px;
        background: var(--card);
        box-shadow: 6px 6px 0 var(--line);
        text-align: center;
      }
      img {
        width: 7rem;
        height: auto;
        transform: rotate(-6deg);
      }
      .label {
        font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        font-size: clamp(2.25rem, 9vw, 3.25rem);
        line-height: 0.95;
        font-weight: 800;
        letter-spacing: -0.045em;
      }
      .marker {
        background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%);
      }
      p {
        max-width: 32ch;
        font-size: 1.0625rem;
        line-height: 1.6;
        color: var(--muted);
      }
      a {
        display: inline-flex;
        align-items: center;
        padding: 0.65rem 1.4rem;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: var(--foreground);
        color: var(--background);
        font-weight: 700;
        text-decoration: none;
        box-shadow: 3px 3px 0 var(--line);
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      a:hover {
        transform: translate(-1px, -1px);
        box-shadow: 4px 4px 0 var(--line);
      }
      a:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--line);
      }
      a:focus-visible {
        outline: 2px solid var(--foreground);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').content = '#121212';
        }
      } catch {}
    </script>
  </head>
  <body>
    <main>
      <img src="/icon-512.png" alt="" width="512" height="512" />
      <span class="label">GitHub / spacesdrive</span>
      <h1>On my <span class="marker">GitHub</span>.</h1>
      <p>Taking you to my GitHub profile. If nothing happens, use the button below.</p>
      <a href="https://github.com/spacesdrive">Open github.com/spacesdrive</a>
    </main>
  </body>
</html>
