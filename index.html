<html lang="en">
  <head>
    <meta charset="UTF-8" />

      name="description"
      content="Ujjwal Kumar Rai: backend developer, growth expert and market research analyst. Co-founder of Aevrin. Projects, experience, hackathon results and writing."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f4f0" />
    <link rel="canonical" href="https://tech.ujjwal.fyi/" />

    <link rel="icon" href="/favicon.ico" sizes="any" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tech.ujjwal.fyi/" />
    <meta property="og:title" content="Ujjwal Kumar Rai · Building Innovative Solutions" />
    <meta
      property="og:description"
      content="Backend developer, growth expert and market research analyst. Co-founder of Aevrin."
    />
    <meta property="og:image" content="https://tech.ujjwal.fyi/og.png" />

    <!-- One Person entity, shared by @id with blog.ujjwal.fyi, so search engines and AI tools
         can tell this Ujjwal Kumar Rai apart from others with the same name. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "url": "https://tech.ujjwal.fyi/",
        "mainEntity": {
          "@type": "Person",
          "@id": "https://tech.ujjwal.fyi/#person",
          "name": "Ujjwal Kumar Rai",
          "url": "https://tech.ujjwal.fyi",
          "image": "https://tech.ujjwal.fyi/icon-512.png",
          "jobTitle": "Co-founder",
          "description": "Backend developer, growth expert and market research analyst. Co-founder of Aevrin.",
          "worksFor": { "@type": "Organization", "name": "Aevrin", "url": "https://aevrin.ai" },
          "knowsAbout": ["Backend development", "AI security", "Claude Code", "Growth"],
          "sameAs": [
            "https://blog.ujjwal.fyi/",
            "https://www.instagram.com/ujjwal.fyi",
            "https://x.com/codewithujjwal",
            "https://www.youtube.com/@rec709.studio",
            "https://github.com/spacesdrive",
            "https://www.linkedin.com/in/u-k-r/",
            "https://www.reddit.com/user/codewithujjwal/",
            "https://medium.com/@ujjwal_kumar_rai"
          ]
        }
      }
    </script>

    <!-- Paper is the brand's default ground, so dark mode only applies once chosen. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').content = '#121212';
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
